name: deploy

# Push to main: test, then deploy only the services that changed.
# Changes to libs/ or uv.lock redeploy every service.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy (directory name under services/)
        required: true

permissions:
  contents: read
  id-token: write # Workload Identity Federation

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  changes:
    needs: test
    # Skipped until the GCP repository variables are configured (see README).
    if: vars.GCP_PROJECT != ''
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        env:
          BEFORE: ${{ github.event.before }}
          REQUESTED: ${{ inputs.service }}
        run: |
          all=$(ls services | grep -v '^_' || true)
          if [[ -n "$REQUESTED" ]]; then
            candidates="$REQUESTED"
          elif ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            candidates="$all" # first push or force push: no reliable diff base
          else
            changed=$(git diff --name-only "$BEFORE" HEAD)
            if grep -qE '^(libs/|uv\.lock$)' <<<"$changed"; then
              candidates="$all"
            else
              candidates=$(grep -oP '^services/\K[^/_][^/]*' <<<"$changed" | sort -u || true)
            fi
          fi
          deployable=()
          for s in $candidates; do
            [[ -f "services/$s/Dockerfile" ]] && deployable+=("$s")
          done
          echo "services=$(printf '%s\n' "${deployable[@]}" | jq -Rsc 'split("\n") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  deploy:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
      - run: scripts/deploy.sh "${{ matrix.service }}"
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
